version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: crewora-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crewora}
      POSTGRES_USER: ${POSTGRES_USER:-crewora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_db_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  db_test:
    image: postgres:15-alpine
    container_name: crewora-db-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: crewora_test
      POSTGRES_USER: crewora
      POSTGRES_PASSWORD: crewora
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: crewora-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crewora_user}:${POSTGRES_PASSWORD:-secure_db_password}@database:5432/${POSTGRES_DB:-crewora}?schema=public
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_here}
      NODE_ENV: production
    volumes:
      - shared_uploads:/app/backend/uploads
    depends_on:
      - database
    ports:
      - "5000:5000"

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    container_name: crewora-web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
      NEXT_PUBLIC_ANDROID_APK_URL: ${NEXT_PUBLIC_ANDROID_APK_URL:-http://localhost/uploads/crewora-app.apk}
      NEXT_PUBLIC_PLAY_STORE_URL: ${NEXT_PUBLIC_PLAY_STORE_URL:-}
      NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-1.0.0}
      NEXT_PUBLIC_APP_RELEASE_DATE: ${NEXT_PUBLIC_APP_RELEASE_DATE:-June 2, 2026}
      NEXT_PUBLIC_APK_SIZE: ${NEXT_PUBLIC_APK_SIZE:-15.4 MB}
      NEXT_PUBLIC_MIN_ANDROID_VERSION: ${NEXT_PUBLIC_MIN_ANDROID_VERSION:-Android 8.0 (Oreo) or higher}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: crewora-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - shared_uploads:/var/www/uploads:ro
    depends_on:
      - web
      - backend

volumes:
  postgres_data:
  shared_uploads:
