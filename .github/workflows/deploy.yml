# ============================================================
# CREWORA — CI/CD Deployment Pipeline
# ============================================================
# 1. Run all Jest tests → fail deployment if any test fails
# 2. Build Docker image + tag with git SHA
# 3. Deploy to staging → run smoke tests
# 4. If smoke tests pass → deploy to production (canary: 10%)
# 5. Monitor error rate for 5 minutes → auto-rollback on spike
# 6. If stable → route 100% traffic
# ============================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: crewora/crewora-backend
  NODE_VERSION: '20'

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: crewora_test
          POSTGRES_USER: crewora
          POSTGRES_PASSWORD: crewora
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://crewora:crewora@localhost:5432/crewora_test

      - name: Run Prisma migrations
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://crewora:crewora@localhost:5432/crewora_test

      - name: Type check
        run: npm run typecheck
        env:
          NODE_ENV: test

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://crewora:crewora@localhost:5432/crewora_test
          JWT_CUSTOMER_ACCESS_SECRET: test_customer_access_secret_key_min_32_chars
          JWT_CUSTOMER_REFRESH_SECRET: test_customer_refresh_secret_key_min_32_chars
          JWT_WORKER_ACCESS_SECRET: test_worker_access_secret_key_min_32_chars
          JWT_WORKER_REFRESH_SECRET: test_worker_refresh_secret_key_min_32_chars
          JWT_ADMIN_ACCESS_SECRET: test_admin_access_secret_key_min_32_chars
          JWT_ADMIN_REFRESH_SECRET: test_admin_refresh_secret_key_min_32_chars
          CLIENT_URL: http://localhost:3000
          SMTP_HOST: localhost
          SMTP_USER: test
          SMTP_PASS: test
          EMAIL_FROM: test@test.com
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/backend.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging..."
          # Replace with actual deploy command for your infrastructure
          # Examples:
          #   - SSH + docker-compose pull && docker-compose up -d
          #   - kubectl set image deployment/crewora-backend ...
          #   - Render/GCP/AWS deploy command
          echo "Deployment to staging triggered"

      - name: Wait for deployment
        run: sleep 30

      - name: Run smoke tests
        run: |
          chmod +x backend/scripts/smoke-test.sh
          ./backend/scripts/smoke-test.sh https://staging.crewora.in

  deploy-production:
    name: Deploy to Production (Canary)
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy canary (10% traffic)
        run: |
          echo "Deploying canary to production (10% traffic)..."
          # Replace with actual canary deploy command
          # This should route 10% of traffic to the new version

      - name: Monitor for 5 minutes
        run: |
          echo "Monitoring error rate for 5 minutes..."
          sleep 300
          # In a real setup, query your monitoring system here
          # If error rate > 2%, the deploy script handles rollback

      - name: Route 100% traffic
        if: success()
        run: |
          echo "Canary stable — routing 100% traffic to new version..."
          # Route all traffic to new version

      - name: Final health check
        run: |
          chmod +x backend/scripts/smoke-test.sh
          ./backend/scripts/smoke-test.sh https://api.crewora.in

      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deployment failed — rolling back..."
          # Rollback to previous version
          echo "Rollback complete"
